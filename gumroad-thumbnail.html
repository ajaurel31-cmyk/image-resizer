<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gumroad Thumbnail – Shotera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 600px;
    height: 400px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f14;
  }
  .card {
    width: 600px;
    height: 400px;
    background: linear-gradient(135deg, #1a1a2e 0%, #0f0f14 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .bg-glow {
    position: absolute;
    width: 400px;
    height: 400px;
    border-radius: 50%;
    filter: blur(120px);
    opacity: 0.3;
  }
  .glow-1 { background: #8b5cf6; top: -100px; left: -50px; }
  .glow-2 { background: #3b82f6; bottom: -100px; right: -50px; }
  .logo {
    width: 64px;
    height: 64px;
    border-radius: 16px;
    background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 20px;
    position: relative;
    z-index: 1;
  }
  .logo svg {
    width: 36px;
    height: 36px;
  }
  .title {
    font-size: 42px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -1px;
    position: relative;
    z-index: 1;
  }
  .subtitle {
    font-size: 16px;
    color: #8b8b9e;
    margin-top: 8px;
    position: relative;
    z-index: 1;
  }
  .badge {
    margin-top: 24px;
    background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    padding: 8px 20px;
    border-radius: 100px;
    position: relative;
    z-index: 1;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="logo">
    <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="10" y="4" width="16" height="28" rx="3" stroke="white" stroke-width="2" fill="none"/>
      <path d="M4 10h4M4 26h4M28 10h4M28 26h4" stroke="white" stroke-width="2" stroke-linecap="round"/>
      <path d="M4 10V6M4 26v4M32 10V6M32 26v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="title">Shotera</div>
  <div class="subtitle">App Store Screenshots in Seconds</div>
  <div class="badge">One-Time Purchase</div>
</div>
</body>
</html>
