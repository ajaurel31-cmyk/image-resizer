<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="card" x1="6" y1="6" x2="24" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="img" x1="9" y1="11" x2="21" y2="22" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sparkle" x1="22" y1="4" x2="28" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg)"/>

  <!-- Phone/screenshot card -->
  <rect x="6.5" y="7" width="17" height="19" rx="2.5" fill="url(#card)"/>

  <!-- Image area inside card -->
  <rect x="8.5" y="9" width="13" height="9.5" rx="1.5" fill="url(#img)"/>

  <!-- Mountain/landscape in image area -->
  <path d="M8.5 16 L12 12.5 L15 15 L17.5 12 L21.5 16.5 L21.5 18 Q21.5 18.5 21 18.5 L9 18.5 Q8.5 18.5 8.5 18Z" fill="white" opacity="0.3"/>

  <!-- Sun in image -->
  <circle cx="11" cy="11.5" r="1.5" fill="white" opacity="0.5"/>

  <!-- Text lines below image -->
  <rect x="8.5" y="20.5" width="9" height="1.2" rx="0.6" fill="#c4b5fd" opacity="0.7"/>
  <rect x="8.5" y="23" width="6" height="1.2" rx="0.6" fill="#c4b5fd" opacity="0.5"/>

  <!-- Sparkle/magic star -->
  <path d="M25 7 L25.8 9.2 L28 10 L25.8 10.8 L25 13 L24.2 10.8 L22 10 L24.2 9.2Z" fill="url(#sparkle)"/>

  <!-- Small resize arrow -->
  <path d="M24 20 L27 23 M27 23 L27 20.5 M27 23 L24.5 23" stroke="white" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9"/>
</svg>
