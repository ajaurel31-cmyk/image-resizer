<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg1" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f1ddb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="bg2" cx="75%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg3" cx="20%" cy="85%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="glass" x1="6" y1="5" x2="22" y2="27" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.1"/>
    </linearGradient>
    <linearGradient id="img" x1="8" y1="7" x2="20" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="ring" x1="22" y1="20" x2="29" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7.5" fill="url(#bg1)"/>
  <rect width="32" height="32" rx="7.5" fill="url(#bg2)"/>
  <rect width="32" height="32" rx="7.5" fill="url(#bg3)"/>

  <!-- Back card -->
  <rect x="10" y="7.5" width="16" height="19.5" rx="2.2" fill="white" fill-opacity="0.1" stroke="white" stroke-opacity="0.1" stroke-width="0.5" transform="rotate(4, 18, 17)"/>

  <!-- Front card -->
  <rect x="7" y="5.5" width="16" height="19.5" rx="2.2" fill="url(#glass)" stroke="white" stroke-opacity="0.3" stroke-width="0.5"/>

  <!-- Image area -->
  <rect x="8.5" y="7.5" width="13" height="9" rx="1.2" fill="url(#img)" opacity="0.55"/>

  <!-- Mountain -->
  <path d="M8.5 14.5 L12 11 L14.5 13 L17.5 10.5 L21.5 14.5 L21.5 15.5 Q21.5 16.5 20.5 16.5 L9.5 16.5 Q8.5 16.5 8.5 15.5Z" fill="white" opacity="0.22"/>

  <!-- Sun -->
  <circle cx="11" cy="9.5" r="1.3" fill="white" opacity="0.35"/>

  <!-- Content lines -->
  <rect x="8.5" y="18.5" width="7.5" height="1" rx="0.5" fill="white" opacity="0.2"/>
  <rect x="8.5" y="20.5" width="5" height="1" rx="0.5" fill="white" opacity="0.13"/>

  <!-- Resize ring -->
  <circle cx="25" cy="24" r="3.2" fill="none" stroke="url(#ring)" stroke-width="0.8"/>
  <path d="M23.8 22.8 L26.2 25.2" stroke="white" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M23.8 22.8 L23.8 23.8 M23.8 22.8 L24.8 22.8" stroke="white" stroke-width="0.7" stroke-linecap="round"/>
  <path d="M26.2 25.2 L26.2 24.2 M26.2 25.2 L25.2 25.2" stroke="white" stroke-width="0.7" stroke-linecap="round"/>
</svg>
