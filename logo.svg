<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Rich mesh-style background gradient -->
    <linearGradient id="bg1" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4f1ddb"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <radialGradient id="bg2" cx="75%" cy="20%" r="60%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f472b6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="bg3" cx="20%" cy="85%" r="50%" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>

    <!-- Glass card fill -->
    <linearGradient id="glass" x1="120" y1="80" x2="380" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.10"/>
    </linearGradient>
    <linearGradient id="glass-back" x1="160" y1="120" x2="400" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="white" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="white" stop-opacity="0.05"/>
    </linearGradient>

    <!-- Image area gradient -->
    <linearGradient id="img-grad" x1="148" y1="168" x2="320" y2="296" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Accent ring gradient -->
    <linearGradient id="ring" x1="340" y1="300" x2="460" y2="440" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#f9a8d4"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>

    <!-- Filters -->
    <filter id="card-blur" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12" result="shadow"/>
      <feFlood flood-color="#1e1b4b" flood-opacity="0.25" result="color"/>
      <feComposite in="color" in2="shadow" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <!-- === BACKGROUND === -->
  <rect width="512" height="512" rx="112" fill="url(#bg1)"/>
  <rect width="512" height="512" rx="112" fill="url(#bg2)"/>
  <rect width="512" height="512" rx="112" fill="url(#bg3)"/>

  <!-- === BACK CARD (offset, layered depth) === -->
  <g filter="url(#card-blur)">
    <rect x="148" y="108" width="256" height="312" rx="24" fill="url(#glass-back)" stroke="white" stroke-opacity="0.12" stroke-width="1.5" transform="rotate(4, 276, 264)"/>
  </g>

  <!-- === FRONT CARD (glassmorphism) === -->
  <g filter="url(#card-blur)">
    <rect x="108" y="88" width="256" height="312" rx="24" fill="url(#glass)" stroke="white" stroke-opacity="0.3" stroke-width="1.5"/>
  </g>

  <!-- Image preview area -->
  <rect x="132" y="116" width="208" height="148" rx="14" fill="url(#img-grad)" opacity="0.6"/>

  <!-- Landscape: mountain silhouette -->
  <path d="M132 232 L192 176 L232 208 L280 164 L340 232 L340 250 Q340 264 326 264 L146 264 Q132 264 132 250Z" fill="white" opacity="0.2"/>

  <!-- Sun -->
  <circle cx="176" cy="152" r="18" fill="white" opacity="0.35"/>

  <!-- Content lines -->
  <rect x="132" y="284" width="120" height="10" rx="5" fill="white" opacity="0.22"/>
  <rect x="132" y="308" width="80" height="10" rx="5" fill="white" opacity="0.14"/>
  <rect x="132" y="332" width="56" height="8" rx="4" fill="white" opacity="0.10"/>

  <!-- === ACCENT: resize ring === -->
  <!-- Glow behind ring -->
  <circle cx="400" cy="384" r="52" fill="url(#ring)" opacity="0.3" filter="url(#glow)"/>
  <!-- Ring -->
  <circle cx="400" cy="384" r="44" fill="none" stroke="url(#ring)" stroke-width="5"/>
  <!-- Diagonal resize arrows inside ring -->
  <path d="M384 368 L416 400" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M384 368 L384 378 M384 368 L394 368" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <path d="M416 400 L416 390 M416 400 L406 400" stroke="white" stroke-width="4" stroke-linecap="round"/>
</svg>
