<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gumroad Cover – Shotera</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0f0f14;
  }
  .card {
    width: 1280px;
    height: 720px;
    background: linear-gradient(135deg, #1a1a2e 0%, #0f0f14 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
  }
  .bg-glow {
    position: absolute;
    border-radius: 50%;
    filter: blur(160px);
    opacity: 0.25;
  }
  .glow-1 { background: #8b5cf6; width: 600px; height: 600px; top: -200px; left: -100px; }
  .glow-2 { background: #3b82f6; width: 500px; height: 500px; bottom: -150px; right: -50px; }
  .glow-3 { background: #6366f1; width: 300px; height: 300px; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.15; }

  .left {
    flex: 1;
    padding: 80px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .logo {
    width: 56px;
    height: 56px;
    border-radius: 14px;
    background: linear-gradient(135deg, #8b5cf6, #3b82f6);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 28px;
  }
  .logo svg { width: 32px; height: 32px; }
  .title {
    font-size: 56px;
    font-weight: 700;
    color: #fff;
    letter-spacing: -2px;
    line-height: 1.1;
  }
  .subtitle {
    font-size: 22px;
    color: #8b8b9e;
    margin-top: 16px;
    line-height: 1.5;
    max-width: 440px;
  }
  .features {
    display: flex;
    gap: 20px;
    margin-top: 32px;
    flex-wrap: wrap;
  }
  .feature {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 10px;
    padding: 10px 18px;
    color: #c4b5fd;
    font-size: 14px;
    font-weight: 500;
  }

  .right {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }
  .mockup {
    width: 360px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .mockup-header {
    display: flex;
    align-items: center;
    gap: 12px;
  }
  .mockup-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
  }
  .dot-r { background: #ef4444; }
  .dot-y { background: #eab308; }
  .dot-g { background: #22c55e; }
  .mockup-row {
    display: flex;
    gap: 12px;
  }
  .mockup-phone {
    width: 80px;
    height: 140px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .phone-1 { background: linear-gradient(135deg, rgba(139,92,246,0.3), rgba(59,130,246,0.3)); }
  .phone-2 { background: linear-gradient(135deg, rgba(99,102,241,0.3), rgba(139,92,246,0.3)); }
  .phone-3 { background: linear-gradient(135deg, rgba(59,130,246,0.3), rgba(99,102,241,0.3)); }
  .phone-4 { background: linear-gradient(135deg, rgba(139,92,246,0.2), rgba(59,130,246,0.2)); }
  .phone-label {
    font-size: 10px;
    color: rgba(255,255,255,0.5);
    font-weight: 500;
  }
  .mockup-bar {
    height: 36px;
    background: linear-gradient(90deg, #8b5cf6, #3b82f6);
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 13px;
    font-weight: 600;
  }
</style>
</head>
<body>
<div class="card">
  <div class="bg-glow glow-1"></div>
  <div class="bg-glow glow-2"></div>
  <div class="bg-glow glow-3"></div>

  <div class="left">
    <div class="logo">
      <svg viewBox="0 0 36 36" fill="none" xmlns="http://www.w3.org/2000/svg">
        <rect x="10" y="4" width="16" height="28" rx="3" stroke="white" stroke-width="2" fill="none"/>
        <path d="M4 10h4M4 26h4M28 10h4M28 26h4" stroke="white" stroke-width="2" stroke-linecap="round"/>
        <path d="M4 10V6M4 26v4M32 10V6M32 26v4" stroke="white" stroke-width="2" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="title">Shotera</div>
    <div class="subtitle">Professional screenshot designer for App Store & Google Play. No Figma needed.</div>
    <div class="features">
      <div class="feature">Batch Export</div>
      <div class="feature">12 Themes</div>
      <div class="feature">Device Frames</div>
      <div class="feature">All Platforms</div>
    </div>
  </div>

  <div class="right">
    <div class="mockup">
      <div class="mockup-header">
        <div class="mockup-dot dot-r"></div>
        <div class="mockup-dot dot-y"></div>
        <div class="mockup-dot dot-g"></div>
      </div>
      <div class="mockup-row">
        <div class="mockup-phone phone-1"><span class="phone-label">iPhone</span></div>
        <div class="mockup-phone phone-2"><span class="phone-label">iPad</span></div>
        <div class="mockup-phone phone-3"><span class="phone-label">Android</span></div>
        <div class="mockup-phone phone-4"><span class="phone-label">Mac</span></div>
      </div>
      <div class="mockup-row">
        <div class="mockup-phone phone-3"><span class="phone-label">Watch</span></div>
        <div class="mockup-phone phone-1"><span class="phone-label">TV</span></div>
        <div class="mockup-phone phone-4"><span class="phone-label">Vision</span></div>
        <div class="mockup-phone phone-2"><span class="phone-label">Tablet</span></div>
      </div>
      <div class="mockup-bar">Export All Sizes</div>
    </div>
  </div>
</div>
</body>
</html>
