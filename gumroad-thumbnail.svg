<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#0f0f14"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="85%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bg)"/>
  <rect width="600" height="400" fill="url(#glow1)"/>
  <rect width="600" height="400" fill="url(#glow2)"/>

  <!-- Logo -->
  <rect x="268" y="100" width="64" height="64" rx="16" fill="url(#accent)"/>
  <rect x="282" y="110" width="16" height="28" rx="3" stroke="white" stroke-width="2" fill="none" transform="translate(2,6)"/>
  <line x1="276" y1="122" x2="280" y2="122" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="276" y1="138" x2="280" y2="138" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="320" y1="122" x2="324" y2="122" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="320" y1="138" x2="324" y2="138" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="276" y1="122" x2="276" y2="118" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="276" y1="138" x2="276" y2="142" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="324" y1="122" x2="324" y2="118" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>
  <line x1="324" y1="138" x2="324" y2="142" stroke="white" stroke-width="2" stroke-linecap="round" transform="translate(0,6)"/>

  <!-- Title -->
  <text x="300" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="42" font-weight="700" fill="white" letter-spacing="-1">Shotera</text>

  <!-- Subtitle -->
  <text x="300" y="240" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#8b8b9e">App Store Screenshots in Seconds</text>

  <!-- Badge -->
  <rect x="222" y="268" width="156" height="38" rx="19" fill="url(#accent)"/>
  <text x="300" y="292" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="white">One-Time Purchase</text>
</svg>
